# ---- CN Project teamX : Mac 1 private DNS ----
# Answer only on loopback and our LAN address
listen-address=127.0.0.1,10.7.10.22
bind-interfaces

# Don't read /etc/resolv.conf; forward everything that isn't ours to public DNS
no-resolv
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv

# We are authoritative for teamX.test: unknown names get NXDOMAIN, never forwarded
local=/teamX.test/

# Project A records -> the edge (Mac 2, nginx)
host-record=app.teamX.test,10.7.22.227
host-record=api.teamX.test,10.7.22.227

# TTL for our records, visible in dig's ANSWER section
local-ttl=60

# Log every query - this is evidence
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
